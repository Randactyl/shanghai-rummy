<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png (the link preview). Re-render after editing with a
       1200x630 headless Firefox screenshot; the command is in the README. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#145e43"/>
      <stop offset="0.45" stop-color="#0f4d36"/>
      <stop offset="1" stop-color="#0b3a29"/>
    </radialGradient>
    <pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#284fa8"/>
      <rect width="6" height="12" fill="#1d3f8a"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <g id="face">
      <rect x="-80" y="-112" width="160" height="224" rx="14" fill="#fbf8ef" stroke="#d9d3c2" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#felt)"/>

  <!-- fanned hand -->
  <g transform="translate(905 620) scale(0.9)" font-family="Georgia, 'Times New Roman', serif" font-weight="700" filter="url(#shadow)">
    <g transform="rotate(-30) translate(0 -330)">
      <rect x="-80" y="-112" width="160" height="224" rx="14" fill="#fbf8ef" stroke="#d9d3c2" stroke-width="2"/>
      <rect x="-70" y="-102" width="140" height="204" rx="9" fill="url(#back)"/>
    </g>
    <g transform="rotate(-15) translate(0 -330)" fill="#1d2024">
      <use href="#face"/>
      <text x="-62" y="-70" font-size="40">7</text>
      <text x="-62" y="-36" font-size="32">♠</text>
      <text x="0" y="28" font-size="96" text-anchor="middle">♠</text>
    </g>
    <g transform="rotate(0) translate(0 -330)" fill="#c8243b">
      <use href="#face"/>
      <text x="-62" y="-70" font-size="40">8</text>
      <text x="-62" y="-36" font-size="32">♥</text>
      <text x="0" y="28" font-size="96" text-anchor="middle">♥</text>
    </g>
    <g transform="rotate(15) translate(0 -330)" fill="#c8243b">
      <use href="#face"/>
      <text x="-62" y="-70" font-size="40">9</text>
      <text x="-62" y="-36" font-size="32">♦</text>
      <text x="0" y="28" font-size="96" text-anchor="middle">♦</text>
    </g>
    <g transform="rotate(30) translate(0 -330)" fill="#1d2024">
      <use href="#face"/>
      <text x="-62" y="-70" font-size="40">10</text>
      <text x="-62" y="-36" font-size="32">♣</text>
      <text x="0" y="28" font-size="96" text-anchor="middle">♣</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="90" y="220" font-size="52" letter-spacing="14"><tspan fill="#ff7b8b">♥</tspan><tspan fill="#f3efe2">♠</tspan><tspan fill="#ff7b8b">♦</tspan><tspan fill="#f3efe2">♣</tspan></text>
    <text x="86" y="320" font-size="88" font-weight="700" fill="#f3efe2">Shanghai</text>
    <text x="86" y="412" font-size="88" font-weight="700" fill="#f3efe2">Rummy</text>
  </g>
  <rect x="90" y="446" width="96" height="5" rx="2.5" fill="#f2c14e"/>
  <text x="90" y="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#b9c9bd">Play with family, browser to browser.</text>
</svg>
